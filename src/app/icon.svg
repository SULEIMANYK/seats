<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Two chairs, as the wordmark. Numeric references rather than raw UTF-8:
       the file is served as-is, and a mis-declared charset turns the emoji
       into mojibake with no way to tell from the markup that it happened. -->
  <text x="16" y="23" font-size="17" text-anchor="middle"
        font-family="Apple Color Emoji, Segoe UI Emoji, Noto Color Emoji, sans-serif"
  >&#129681;&#129681;</text>
</svg>
